<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5"
                    flood-color="#5B7360" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- pale sage background circle -->
  <circle cx="60" cy="62" r="54" fill="#E3EDE0"/>
  <!-- speaking dashes, upper right -->
  <g stroke="#96B392" stroke-width="4.6" fill="none" stroke-linecap="round">
    <path d="M92 34 L97 26"/>
    <path d="M99 43 L108 38"/>
    <path d="M101 53 L110 52"/>
  </g>
  <!-- ear pods -->
  <rect x="20" y="57" width="11" height="24" rx="5.5" fill="#96B392"/>
  <rect x="89" y="57" width="11" height="24" rx="5.5" fill="#96B392"/>
  <!-- sprout: stem, leaf with vein -->
  <path d="M58 43 C 58 38, 60 34, 65 31" stroke="#587F5C" stroke-width="2.8"
        fill="none" stroke-linecap="round"/>
  <path d="M65 31 C 63 22, 68 14, 78 12 C 79 21, 74 28, 65 31 Z" fill="#82AA6E"/>
  <path d="M65 31 C 68 27, 71 22, 73 17" stroke="#5E8452" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>
  <!-- head as a speech bubble, soft shadow, curved tail bottom-left -->
  <g filter="url(#soft)">
    <path d="M46 87 C 43 93, 40 97, 35 100 C 44 98, 50 93, 55 89 Z" fill="#F6F3E9"/>
    <rect x="28" y="46" width="64" height="44" rx="22" fill="#F6F3E9"/>
  </g>
  <!-- antenna ball sits on the head's top edge -->
  <circle cx="58" cy="44.5" r="5" fill="#6E9070"/>
  <!-- face screen -->
  <rect x="36" y="54" width="48" height="28" rx="13" fill="#3C5A46"/>
  <!-- happy eyes -->
  <g stroke="#F1EFE3" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M46.5 70 q 5.5 -7 11 0"/>
    <path d="M62.5 70 q 5.5 -7 11 0"/>
  </g>
</svg>
